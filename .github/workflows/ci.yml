name: CI (dev)

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ '**' ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # --- API: Java + Maven ---
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Maven verify & test
        working-directory: api
        run: mvn -B verify

      - name: Build API image (linux/amd64) for dev
        working-directory: api
        run: |
          docker build -f Dockerfile.catalyst --platform linux/amd64 -t ksp-api-dev:${{ github.sha }} .

      # --- ML Service: Python ---
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Python deps & test
        working-directory: ml-service
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pytest -q

      - name: Build ML image (linux/amd64) for dev
        working-directory: ml-service
        run: |
          docker build -f Dockerfile.catalyst --platform linux/amd64 -t ksp-ml-dev:${{ github.sha }} .

      # --- Frontend: Node ---
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Frontend install & test
        working-directory: frontend
        run: |
          npm ci
          npm test

      - name: Build frontend image (linux/amd64) for dev
        working-directory: frontend
        run: |
          docker build -f Dockerfile.catalyst --platform linux/amd64 -t ksp-frontend-dev:${{ github.sha }} .
