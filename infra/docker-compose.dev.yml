# =============================================================================
# KSP Intelligence Portal — Docker Compose Dev Override
# File: infra/docker-compose.dev.yml
#
# Used with: docker compose -f docker-compose.yml -f docker-compose.dev.yml up
#
# Adds Kibana for ES inspection, debug logging, and dev-friendly settings.
# =============================================================================

services:

  # ===========================================================================
  # Kibana — dev-only, ES inspection UI on port 5601
  # ===========================================================================

  # ===========================================================================
  # Debug logging overrides for infrastructure services
  # ===========================================================================

  postgres:
    environment:
      POSTGRES_INITDB_ARGS: "--auth-local=trust"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

