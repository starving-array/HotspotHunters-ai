# =============================================================================
# KSP Intelligence Portal — Docker Compose Dev Override
# File: infra/docker-compose.dev.yml
#
# Used with: docker compose -f docker-compose.yml -f docker-compose.dev.yml up
#
# Adds Kibana for ES inspection, debug logging, and dev-friendly settings.
# =============================================================================

services:

  # ===========================================================================
  # Kibana — dev-only, ES inspection UI on port 5601
  # ===========================================================================
  kibana:
    image: docker.elastic.co/kibana/kibana:8.14.0
    container_name: ksp-kibana
    networks: [ksp-network]
    depends_on:
      elasticsearch:
        condition: service_healthy
    ports:
      - "5601:5601"
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      ELASTICSEARCH_USERNAME: ""
      ELASTICSEARCH_PASSWORD: ""
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:5601/api/status || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    profiles: ["dev"]

  # ===========================================================================
  # Debug logging overrides for infrastructure services
  # ===========================================================================
  kafka:
    environment:
      KAFKA_LOG4J_ROOT_LOGLEVEL: INFO
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  postgres:
    environment:
      POSTGRES_INITDB_ARGS: "--auth-local=trust"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  elasticsearch:
    environment:
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
