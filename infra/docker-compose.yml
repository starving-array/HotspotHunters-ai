name: ksp-intelligence-portal

networks:
  ksp-network:
    driver: bridge

  volumes:
    postgres-data:
    redis-data:
    prometheus-data:
    grafana-data:
    neo4j-data:

services:


  postgres:
    image: postgres:16
    container_name: ksp-postgres
    networks: [ksp-network]
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ksp_intelligence}
      POSTGRES_USER: ${POSTGRES_USER:-ksp_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped


  redis:
    image: redis:7-alpine
    container_name: ksp-redis
    networks: [ksp-network]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  spring-boot-api:
    build:
      context: ../api
      dockerfile: Dockerfile
    container_name: ksp-api
    networks: [ksp-network]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"
    env_file: ../.env
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  python-ml:
    build:
      context: ../ml-service
      dockerfile: Dockerfile
    container_name: ksp-ml
    networks: [ksp-network]
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "8001:8001"
    env_file: ../.env
    environment:
      REDIS_HOST: redis
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8001/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: ksp-prometheus
    networks: [ksp-network]
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      spring-boot-api:
        condition: service_healthy
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.1.0
    container_name: ksp-grafana
    networks: [ksp-network]
    ports:
      - "3001:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_started
    restart: unless-stopped

  neo4j:
    image: neo4j:5.20.0
    container_name: ksp-neo4j
    networks: [ksp-network]
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/changeme
      NEO4J_PLUGINS: '["graph-data-science"]'
      NEO4J_dbms_memory_pagecache_size: 512M
      NEO4J_dbms_memory_heap_initial__size: 1G
      NEO4J_dbms_memory_heap_max__size: 1G
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "changeme", "RETURN 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  react-frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: ksp-frontend
    networks: [ksp-network]
    depends_on:
      spring-boot-api:
        condition: service_healthy
    ports:
      - "5173:5173"
    environment:
      VITE_PROXY_TARGET: http://spring-boot-api:8080
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:5173"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped