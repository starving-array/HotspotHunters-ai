# Development profile for KSP — all values sourced from .env
spring:
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://postgres:5432/ksp_intelligence}
    username: ${POSTGRES_USER:ksp_app}
    password: ${POSTGRES_PASSWORD:changeme}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
ksp:
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:29092}
    topics:
      fir-events: ${KAFKA_FIR_TOPIC:fir-events}
      alert-events: ${KAFKA_ALERT_TOPIC:alert-events}
      audit-events: ${KAFKA_AUDIT_TOPIC:audit-events}
    consumer-groups:
      indexing: indexing-service
      aggregation: aggregation-service
      anomaly: anomaly-service
  redis:
    host: ${REDIS_HOST:redis}
    port: ${REDIS_PORT:6379}
  ml-service:
    url: ${ML_SERVICE_URL:http://ml-service:8001}
  jwt:
    secret: ${JWT_SECRET:super-secret-jwt-key}
    access-expiry-minutes: ${JWT_ACCESS_EXPIRY_MINUTES:60}
    refresh-expiry-hours: ${JWT_REFRESH_EXPIRY_HOURS:24}
ml:
  service:
    base-url: ${ML_SERVICE_URL:http://ml-service:8001}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus