  # ----- ElasticSearch (COMMENTED FOR CATALYST — replaced by PG full-text search) -----
  # elasticsearch:
  #   uris: ${ELASTICSEARCH_SCHEME:http}://${ELASTICSEARCH_HOST:elasticsearch}:${ELASTICSEARCH_PORT:9200}
  #   connection-timeout: 10s
  #   socket-timeout: 60s

  # ----- Redis -----
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      timeout: 5s
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2

# ----- App-specific — topics, indexes, Redis keys -----
ksp:
  # kafka:
  #   fir-topic: ${KAFKA_FIR_TOPIC:fir-events}
  #   alert-topic: ${KAFKA_ALERT_TOPIC:alert-events}
  #   consumer-groups:
  #     indexing:    indexing-service
  #     aggregation: aggregation-service
  #     anomaly:     anomaly-service
  # elasticsearch:
  #   crime-index: ${ELASTICSEARCH_INDEX:crime-index}
  redis:
    hotspots-key: "hotspots:live"
    district24h-prefix: "district:24h:"
    district-rollup-prefix: "district:rollup:60:"
    district-baseline-prefix: "district:baseline:24h:"
    stream-key: "alerts:stream"
    stream-maxlen: 500
  anomaly:
    rolling-window-minutes: 60            # 60-min window for current count
    baseline-window-minutes: 1440          # 24h baseline for mean+stddev
    spike-threshold-sigma: 2.0             # spike when current - mean > 2*sigma
    high-severity-sigma: 3.0               # publish HIGH above this many sigma

# ----- ML Service -----
ml:
  service:
    base-url: ${ML_SERVICE_URL:http://ml-service:8001}

# ----- Actuator -----
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,kafkaLag
  endpoint:
    health:
      show-details: when-authorized
  health:
    redis:
      enabled: true
    elasticsearch:
      enabled: true

# ----- Server -----
server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: native

logging:
  level:
    com.ksp.intelligence: INFO
    org.springframework.kafka: INFO
    org.hibernate.SQL: WARN
