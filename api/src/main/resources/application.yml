# =============================================================================
# KSP Intelligence Portal — Spring Boot main config
# Source: env vars from .env (Docker compose env_file).
# =============================================================================

spring:
  application:
    name: ksp-intelligence-api

  # ----- JPA / Hibernate -----
  jpa:
    hibernate:
      ddl-auto: none     # schema is created by init.sql on postgres container
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
        dialect: org.hibernate.dialect.PostgreSQLDialect
        # Partition routing is automatic in PG 16 — no extra config needed.

  datasource:
    # Reuse env POSTGRES_URL if it's jdbc-form; otherwise build from host/port/db
    url: ${POSTGRES_URL:jdbc:postgresql://${POSTGRES_HOST:postgres}:${POSTGRES_PORT:5432}/${POSTGRES_DB:ksp_intelligence}}
    username: ${POSTGRES_USER:ksp_app}
    password: ${POSTGRES_PASSWORD:changeme}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000

  # ----- Kafka (COMMENTED FOR CATALYST — replaced by EventIngestionController) -----
